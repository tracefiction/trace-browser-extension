<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive Bunker</title>
  <style>
    :root {
      color-scheme: light dark;
      --ground: #FBFAF7; --surface: #FFFFFF; --rule: #E4E2DC; --ink: #1B1F24; --ink2: #5C636B;
      --accent: #8A5A12; --accent-ink: #FFFFFF; --track: #CFCDC6; --control: #BDBBB4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #0E1013; --surface: #16191D; --rule: #262A30; --ink: #F1F2F4; --ink2: #B0B6BE;
        --accent: #E0AE58; --accent-ink: #14100A; --track: #3A3F46; --control: #555B63;
      }
    }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ground); }
    body { width: 360px; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif; }
    button { font-family: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .head { padding: 12px 14px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); }
    .head svg { flex: none; }
    .title { flex: 1; font-size: 15px; font-weight: 600; }
    .switch { flex: none; width: 38px; height: 22px; border-radius: 11px; border: 0; padding: 2px; background: var(--track); display: flex; justify-content: flex-start; }
    .switch span { width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; }
    .switch[aria-pressed="true"] { background: var(--accent); justify-content: flex-end; }
    .back { flex: none; display: flex; border: 0; padding: 4px 6px; margin: -4px -6px; background: none; border-radius: 6px; }

    .block { border-bottom: 1px solid var(--rule); }
    .off { margin: 0; padding: 16px 14px; font-size: 14px; line-height: 1.45; }
    .notice { padding: 14px; display: flex; gap: 10px; }
    .notice svg { flex: none; color: var(--ink2); margin-top: 1px; }
    .notice div { font-size: 14px; line-height: 1.45; }
    .status { padding: 14px; display: flex; flex-direction: column; gap: 2px; }
    .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .small { font-size: 13px; color: var(--ink2); }
    .backup { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .eyebrow { font-size: 12px; font-weight: 600; color: var(--ink2); }
    .backup[data-state="running"] .eyebrow { color: var(--accent); }
    .line { font-size: 13px; line-height: 1.4; color: var(--ink2); }
    .bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
    .bar div { height: 4px; background: var(--ink2); }
    .backup[data-state="running"] .bar div { background: var(--accent); }
    .action { height: 36px; border-radius: 8px; border: 1px solid var(--control); background: var(--surface); font-size: 14px; font-weight: 600; }
    .action.fill { border: 0; background: var(--accent); color: var(--accent-ink); }
    .backup .action { margin-top: 4px; }
    .triggers { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .triggers label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .triggers input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
    .format { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
    .format label { font-size: 14px; }
    .format select { font-size: 14px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--control); background: var(--surface); color: var(--ink); }
    .start { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
    .caption { font-size: 12px; line-height: 1.4; color: var(--ink2); }
    .row { width: 100%; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; text-align: left; border: 0; border-bottom: 1px solid var(--rule); background: none; }
    .row:focus-visible, .switch:focus-visible { outline-offset: -2px; }
    .reason { padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
    .reason > div { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .reason strong { font-size: 14px; font-weight: 600; }
    .again { flex: none; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--control); background: var(--surface); font-size: 13px; font-weight: 600; }
    .foot { padding: 10px 14px; display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink2); }
    .foot a { color: var(--ink2); }
  </style>
</head>
<body>
  <div class="head" id="homeHead">
    <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="1" width="10" height="12" rx="1.5" fill="#E9DFCB"/><rect x="1" y="3" width="10" height="12" rx="1.5" fill="#2A4C5F"/><path d="M5 3h3v6L6.5 7.8 5 9z" fill="#D9982F"/></svg>
    <div class="title" id="name"></div>
    <button type="button" class="switch" id="enabled" aria-pressed="false" aria-label="Keep copies"><span></span></button>
  </div>
  <div class="head" id="subHead" hidden>
    <button type="button" class="back" id="back" aria-label="Back"><svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 1.5 1.5 6.5l5 5"/></svg></button>
    <div class="title" id="subTitle"></div>
  </div>

  <p class="off block" id="off" hidden>Keeps AO3's own file of the works you keep, on this computer.</p>

  <div class="notice block" id="notice" role="status" hidden>
    <svg id="noticePause" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M6.5 5.5v5M9.5 5.5v5"/></svg>
    <svg id="noticeClock" width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.8V8l2.2 1.4"/></svg>
    <div id="noticeText"></div>
  </div>

  <div class="status block" id="status" hidden>
    <div class="big" id="kept"></div>
    <div class="small" id="lastCopy"></div>
  </div>

  <div class="backup block" id="backupBlock" hidden>
    <div class="eyebrow" id="backupEyebrow"></div>
    <div class="big" id="backupCount"></div>
    <div class="bar"><div id="backupBar"></div></div>
    <div class="line" id="backupLine"></div>
    <div class="line" id="downloadsLine">Firefox's downloads panel fills up during a backup. That's expected.</div>
    <button type="button" class="action" id="backupToggle"></button>
  </div>

  <div class="triggers block" id="triggers" hidden>
    <div class="eyebrow">Copy a work when I</div>
    <label><input type="checkbox" data-trigger="bookmark">Bookmark it</label>
    <label><input type="checkbox" data-trigger="later">Mark it for Later</label>
    <label><input type="checkbox" data-trigger="subscribe">Subscribe</label>
    <label><input type="checkbox" data-trigger="kudos">Leave kudos</label>
    <label><input type="checkbox" data-trigger="open">Every work I open</label>
  </div>
  <div class="format block" id="formatRow" hidden>
    <label for="format">Format</label>
    <select id="format">
      <option value="epub">EPUB</option>
      <option value="azw3">AZW3</option>
      <option value="mobi">MOBI</option>
      <option value="pdf">PDF</option>
      <option value="html">HTML</option>
    </select>
  </div>

  <div class="start block" id="backupStart" hidden>
    <button type="button" class="action" id="backup">Back up my lists</button>
    <div class="caption" id="backupCaption"></div>
  </div>

  <button type="button" class="row" id="skippedRow" hidden><span id="skippedRowText"></span><svg width="7" height="12" viewBox="0 0 8 13" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg></button>
  <button type="button" class="row" id="foldRow" hidden><span>What starts a copy</span><svg width="7" height="12" viewBox="0 0 8 13" fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5 6.5 6.5l-5 5"/></svg></button>

  <div class="reason block" id="skippedLocked" hidden>
    <div><strong>Sign in to AO3 to copy locked works</strong><span class="small" id="skippedLockedText"></span></div>
  </div>
  <div class="reason block" id="skippedGone" hidden>
    <div><strong>Hidden or deleted on AO3</strong><span class="small" id="skippedGoneText"></span></div>
  </div>
  <div class="reason block" id="skippedFile" hidden>
    <div><strong>AO3 couldn't make the file</strong><span class="small" id="skippedFileText"></span></div>
    <button type="button" class="again" id="tryAgain">Try again</button>
  </div>

  <div class="foot"><a href="https://github.com/tracefiction/trace-browser-extension" target="_blank" rel="noopener">Open source on GitHub</a><span>From the maker of Trace</span></div>
  <script src="popup.js"></script>
</body>
</html>
