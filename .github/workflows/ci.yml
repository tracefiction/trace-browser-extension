name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  swift-provider-codec:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify shared Safari provider codec
        run: npm run test:swift-provider-codec

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run agent:check
        env:
          TRACE_API_BASE: https://api.tracefiction.com
          TRACE_WEB_ORIGIN: https://www.tracefiction.com
