name: TraceInstalledLifecycleUITests
options:
  bundleIdPrefix: com.tracefiction
targets:
  TraceInstalledLifecycleUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TraceInstalledLifecycleUITests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tracefiction.TraceInstalledLifecycleUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  TraceInstalledLifecycleUITests:
    build:
      targets:
        TraceInstalledLifecycleUITests: test
    test:
      targets:
        - TraceInstalledLifecycleUITests
      environmentVariables:
        TRACE_IOS_FIXTURE_ORIGIN: "${TRACE_IOS_FIXTURE_ORIGIN}"
