<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <script src="popup-config.js"></script>
    <script type="module" src="popup.js"></script>
</head>
<body>
    <main class="popup">
        <header class="popup-brand">
            <img class="popup-brand-mark" src="images/trace-mark.svg" alt="" width="32" height="32" />
            <span class="popup-brand-name">trace</span>
            <span id="popup-connection" class="popup-connection" data-state="off">
                <span class="popup-connection-dot" aria-hidden="true"></span>
                <span class="popup-connection-label">Checking</span>
            </span>
        </header>
        <section class="popup-sheet" aria-labelledby="popup-status">
            <p class="popup-eyebrow" hidden></p>
            <p id="popup-status" class="popup-status" role="status">Checking Trace connection…</p>
            <p id="popup-lead" class="popup-lead">
                Checking extension status…
            </p>
        </section>
        <section
            id="popup-local-settings"
            class="popup-local-settings"
            aria-label="Local site preferences"
        >
            <label class="popup-switch-row" for="pref-ao3-saved-filters">
                <span>Saved filters on AO3</span>
                <input type="checkbox" id="pref-ao3-saved-filters" />
            </label>
        </section>
        <section
            id="popup-pro-settings"
            class="popup-pro-settings hidden"
            aria-label="Extension preferences"
        >
            <label class="popup-switch-row" for="pref-auto-track">
                <span>Automatic tracking</span>
                <input type="checkbox" id="pref-auto-track" />
            </label>
            <label class="popup-switch-row" for="pref-library-inlay">
                <span>Library status on sites</span>
                <input type="checkbox" id="pref-library-inlay" />
            </label>
            <label class="popup-switch-row" for="pref-metadata-improve">
                <span>Improve shared story metadata</span>
                <input type="checkbox" id="pref-metadata-improve" />
            </label>
        </section>
        <div class="popup-actions">
            <button id="popup-import" class="popup-import" type="button">
                Import from this page
            </button>
            <div id="popup-archive-links" class="popup-archive-links" hidden>
                <a
                    id="popup-open-ao3"
                    class="popup-archive-link"
                    href="https://archiveofourown.org/works"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Open AO3
                </a>
                <a
                    id="popup-open-ffn"
                    class="popup-archive-link"
                    href="https://www.fanfiction.net/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Open FFN
                </a>
            </div>
            <a
                id="popup-cta"
                class="popup-cta"
                href="#"
                hidden
            >
                Continue
            </a>
            <button
                id="popup-session-secondary"
                class="popup-cta"
                type="button"
                hidden
            >
                Disconnect
            </button>
            <a
                id="popup-session-help"
                class="popup-cta"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                hidden
            >
                Connection help
            </a>
        </div>
    </main>
</body>
</html>
